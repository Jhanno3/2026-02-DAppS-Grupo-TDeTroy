groups:
  - name: valuacion-jugadores
    rules:
      - alert: AppCaida
        expr: up{job="valuacion-jugadores"} == 0
        for: 1m
        annotations:
          summary: Prometheus no puede consultar la app

      - alert: TasaDeErrorAlta
        expr: >-
          sum(rate(http_server_requests_seconds_count{outcome="SERVER_ERROR", uri!~"/actuator.*"}[5m]))
          / sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m])) > 0.05
        for: 2m
        annotations:
          summary: Mas del 5% de las requests responde 5xx

      - alert: LatenciaAlta
        expr: >-
          histogram_quantile(0.95,
          sum by (le) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*"}[5m]))) > 1
        for: 5m
        annotations:
          summary: El p95 de latencia supera 1 segundo
