groups:
  - name: valuacion-jugadores
    rules:
      - alert: AppCaida
        expr: up{job="valuacion-jugadores"} == 0
        for: 1m
        annotations:
          summary: Prometheus no puede consultar la app

      - alert: TasaDeErrorAlta
        expr: >-
          sum(rate(http_server_requests_seconds_count{outcome="SERVER_ERROR", uri!~"/actuator.*"}[5m]))
          / sum(rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m])) > 0.05
        for: 2m
        annotations:
          summary: Mas del 5% de las requests responde 5xx

      # SLA de specs/plan.md: p95 < 300 ms. Excluye los procesos batch de admin (ingesta,
      # recalculo), que no tienen SLA de latencia.
      - alert: LatenciaAlta
        expr: >-
          histogram_quantile(0.95,
          sum by (le) (rate(http_server_requests_seconds_bucket{uri!~"/actuator.*|/api/v1/cotizaciones/(ingesta|recalculo).*"}[5m]))) > 0.3
        for: 5m
        annotations:
          summary: El p95 de latencia supera el SLA de 300 ms
