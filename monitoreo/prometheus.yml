global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: valuacion-jugadores
    metrics_path: /actuator/prometheus
    authorization:
      type: Bearer
      credentials_file: /run/metrics_token
    static_configs:
      # El backend corre en el host, fuera de Docker.
      - targets: ["host.docker.internal:8080"]
