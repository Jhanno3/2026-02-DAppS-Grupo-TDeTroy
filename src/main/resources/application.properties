spring.application.name=valuacion-jugadores

# Profile por defecto cuando nada mas especifica uno explicitamente (ni spring.profiles.active por
# variable de entorno, ni @ActiveProfiles en un test). Un `mvn spring-boot:run`/`java -jar` local
# sin flags adicionales activa `dev`, que habilita DevDataSeeder (ver config/). CI/tests siempre
# fuerzan `spring.profiles.active=test` explicitamente (ver pom.xml, surefire/failsafe), asi que
# nunca caen en este default ni corren el seeder; un deploy real debe fijar su propio profile por
# variable de entorno si no quiere `dev`.
spring.profiles.default=dev

# Secretos de desarrollo local (constitution.md S4: "prohibido commitear secretos"): si existe
# un .env.properties en la raiz del repo (gitignored, nunca commiteado), sus valores quedan
# disponibles como propiedades normales -- evita tener que exportar variables de entorno a mano
# en cada sesion de shell. `optional:` hace que el arranque no falle si el archivo no existe
# (ej. en CI, donde las variables reales vienen del entorno).
spring.config.import=optional:file:.env.properties

# Datasource: apunta por defecto al Postgres de desarrollo levantado con
# `docker compose up -d db` (docker-compose.yml). Defaults no sensibles para
# desarrollo local (constitution.md §4); en otros ambientes se sobreescriben
# por variable de entorno.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:valuacion_dev}
spring.datasource.username=${DB_USERNAME:valuacion}
spring.datasource.password=${DB_PASSWORD:valuacion}

# El esquema lo posee Flyway. Prohibido ddl-auto=update/create fuera de local
# (constitution.md §1); se deja en validate en todo ambiente para no depender
# de esa distincion.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# CORS por whitelist explicita de origenes (constitution.md, seccion 4: prohibido "*" fuera de
# desarrollo local). Default: puerto por defecto de Vite (T0.8). Separar por coma para
# habilitar mas de un origen; sobreescribir por variable de entorno en cada ambiente.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT stateless (T1.4, plan.md S4, constitution.md S4: "prohibido commitear secretos... claves
# JWT"). El default de abajo es un placeholder no sensible solo para desarrollo local (mismo
# criterio que las credenciales de datasource arriba) -- HS256 exige una clave de al menos 256
# bits (32 bytes); el default tiene bastante margen. En cualquier otro ambiente se sobreescribe
# por variable de entorno.
app.jwt.secret=${JWT_SECRET:secreto-de-desarrollo-local-nunca-usar-en-produccion-cambiar-por-variable-de-entorno}
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:60}

# Football-Data.org (T3.4, plan.md S8.1, constitution.md S1/S4): fixtures/resultados/alineaciones
# via API oficial. api-key sin default (placeholder vacio, nunca una key real commiteada --
# constitution.md S4: "prohibido commitear secretos... incluida la credencial/API key de
# Football-Data.org") -- se provee siempre por variable de entorno.
app.football-data.base-url=${FOOTBALL_DATA_BASE_URL:https://api.football-data.org}
app.football-data.api-key=${FOOTBALL_DATA_API_KEY:}

# WhoScored (plan.md S8.1, constitution.md S1): foto de perfil por jugador via scraping (fuente no
# oficial). Sin API key: no requiere credencial, el acceso es a paginas publicas.
app.whoscored.base-url=${WHOSCORED_BASE_URL:https://es.whoscored.com}
app.whoscored.fetcher-url=${WHOSCORED_FETCHER_URL:http://localhost:3001/fetch}

# Ingesta de rendimiento por liga completa (plan.md S8.1): el sidecar de Playwright
# (scraper-service) expone un endpoint propio que clickea el filtro "All players" y pagina con
# "next" dentro de un browser real, devolviendo el HTML de cada pagina recorrida.
app.whoscored.fetcher-liga-url=${WHOSCORED_FETCHER_LIGA_URL:http://localhost:3001/fetch-liga}
# Liga -> URL de la pagina publica de estadisticas de esa liga en WhoScored (config aparte de la
# logica de scraping, plan.md S8.1): la clave es el nombre de la liga normalizado (sin acentos,
# minusculas, espacios por guiones -- ver com.tdetroy.valuacion.common.Textos#normalizar), ej.
# "la-liga" para Jugador.liga = "La Liga". Default vacio a proposito (igual criterio que
# app.football-data.api-key): no hay una URL real verificada todavia, se completa por variable de
# entorno antes de ingestar contra el WhoScored real -- los tests nunca dependen de este valor,
# usan fixtures propios.
app.whoscored.liga-urls.la-liga=${WHOSCORED_LIGA_LA_LIGA_URL:}
app.whoscored.liga-urls.premier-league=${WHOSCORED_LIGA_PREMIER_LEAGUE_URL:}
app.whoscored.liga-urls.serie-a=${WHOSCORED_LIGA_SERIE_A_URL:}
app.whoscored.liga-urls.bundesliga=${WHOSCORED_LIGA_BUNDESLIGA_URL:}
app.whoscored.liga-urls.ligue-1=${WHOSCORED_LIGA_LIGUE_1_URL:}

# Scheduling de la ingesta semanal de rendimiento (T3.6, plan.md S8.2): domingo 01:00 fixtures
# (Football-Data.org), domingo 02:00 rendimiento (WhoScored) -- una hora de margen para que el
# primero confirme que el partido se jugo antes de que el segundo lo scrapee. Los defaults son
# los del plan; la cadencia semanal en si no es ajustable sin reabrir la constitucion, pero el
# minuto exacto si puede correrse por variable de entorno sin tocar codigo.
app.rendimiento.ingesta.fixtures-cron=${RENDIMIENTO_INGESTA_FIXTURES_CRON:0 0 1 * * SUN}
app.rendimiento.ingesta.rendimiento-cron=${RENDIMIENTO_INGESTA_RENDIMIENTO_CRON:0 0 2 * * SUN}

# Motor de cotizacion (T4.3, plan.md S6.1-S6.3): constantes de configuracion, no valores de
# negocio fijados en el algoritmo (plan.md S6.1: "BASE_INICIAL... se documenta... ajustable sin
# tocar codigo").
# valor-inicial: cotizacion de arranque de un jugador que nunca tuvo un calculo previo (plan.md
# S6.1 paso 4, default documentado explicitamente en 100.00).
app.cotizacion.valor-inicial=${COTIZACION_VALOR_INICIAL:100.00}
# sensibilidad: multiplica el puntaje de rendimiento (normalizado en torno a [-1,1], ver
# CotizacionServiceImpl) antes del clamp de +-20% (plan.md S6.1 paso 3). 0.20 hace que el clamp
# coincida exactamente con los extremos del puntaje normalizado -- el clamp sigue aplicandose
# siempre como red de seguridad (plan.md: "evita saltos irreales"), no solo por este default.
app.cotizacion.sensibilidad=${COTIZACION_SENSIBILIDAD:0.20}
# decay-inactividad: factorAjuste negativo fijo que recibe un jugador activo sin RendimientoPartido
# en la semana en curso (plan.md S6.3), en vez de dejar el calculo congelado. Ejemplo del propio
# plan.md: "-1%".
app.cotizacion.decay-inactividad=${COTIZACION_DECAY_INACTIVIDAD:0.01}
# ventana-historico-semanas: cuantas semanas hacia atras (respecto de la semana en curso) se
# consideran "historico reciente del propio jugador" (plan.md S6.2) para la normalizacion min-max
# de cada metrica -- plan.md pide "reciente" sin fijar un numero; 8 semanas (~2 meses de liga) es
# la asuncion tecnica de este Service, documentada y ajustable sin tocar codigo.
app.cotizacion.ventana-historico-semanas=${COTIZACION_VENTANA_HISTORICO_SEMANAS:8}

# Scheduling del recalculo semanal de cotizacion (T4.5, plan.md S6.4): lunes 03:00, una hora
# despues del fin de la ventana de ingesta semanal (domingo 01:00/02:00, ver
# app.rendimiento.ingesta arriba) para que el calculo siempre disponga de los datos de esa semana.
app.cotizacion.recalculo-cron=${COTIZACION_RECALCULO_CRON:0 0 3 * * MON}

# Venta de tokens contra el sistema (T5.1, UC-10): paga un 15% menos que la cotizacion vigente --
# a diferencia de la compra (UC-09) y de toda operacion P2P (UC-17), que siguen pagando/cobrando la
# cotizacion vigente completa. Es un "spread" deliberado para que vender al sistema sea menos
# conveniente que publicar una oferta P2P (donde el vendedor se queda con el 100% de la
# cotizacion), sin tocar como se calcula la cotizacion en si (constitution.md S2: sigue siendo el
# unico punto de verdad de CotizacionService).
app.token.descuento-venta-sistema=${TOKEN_DESCUENTO_VENTA_SISTEMA:0.15}

# Chequeo periodico de ofertas P2P vencidas (UC-17): cada 5 minutos por defecto -- una oferta
# vence en horas (OfertaP2P.fechaVencimiento, fijada por el vendedor al publicar), no semanas como
# el recalculo de cotizacion, asi que necesita un chequeo mucho mas frecuente para que el
# vencimiento sea razonablemente puntual.
app.ofertas.vencimiento-cron=${OFERTAS_VENCIMIENTO_CRON:0 */5 * * * *}
