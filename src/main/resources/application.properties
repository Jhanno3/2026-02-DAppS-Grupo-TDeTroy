spring.application.name=valuacion-jugadores

# Datasource: apunta por defecto al Postgres de desarrollo levantado con
# `docker compose up -d db` (docker-compose.yml). Defaults no sensibles para
# desarrollo local (constitution.md §4); en otros ambientes se sobreescriben
# por variable de entorno.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:valuacion_dev}
spring.datasource.username=${DB_USERNAME:valuacion}
spring.datasource.password=${DB_PASSWORD:valuacion}

# El esquema lo posee Flyway. Prohibido ddl-auto=update/create fuera de local
# (constitution.md §1); se deja en validate en todo ambiente para no depender
# de esa distincion.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# CORS por whitelist explicita de origenes (constitution.md, seccion 4: prohibido "*" fuera de
# desarrollo local). Default: puerto por defecto de Vite (T0.8). Separar por coma para
# habilitar mas de un origen; sobreescribir por variable de entorno en cada ambiente.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT stateless (T1.4, plan.md S4, constitution.md S4: "prohibido commitear secretos... claves
# JWT"). El default de abajo es un placeholder no sensible solo para desarrollo local (mismo
# criterio que las credenciales de datasource arriba) -- HS256 exige una clave de al menos 256
# bits (32 bytes); el default tiene bastante margen. En cualquier otro ambiente se sobreescribe
# por variable de entorno.
app.jwt.secret=${JWT_SECRET:secreto-de-desarrollo-local-nunca-usar-en-produccion-cambiar-por-variable-de-entorno}
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:60}
