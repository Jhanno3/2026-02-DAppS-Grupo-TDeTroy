services:
  db:
    image: postgres:18.6-alpine
    container_name: valuacion-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: valuacion_dev
      POSTGRES_USER: ${POSTGRES_USER:-valuacion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-valuacion}
    ports:
      - "5432:5432"
    volumes:
      # postgres 18+ guarda los datos en subcarpetas versionadas dentro de
      # /var/lib/postgresql (no directamente en /var/lib/postgresql/data).
      - valuacion_dev_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-valuacion} -d valuacion_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Postgres real para correr tests de integración localmente (Testcontainers, T0.7,
  # levanta sus propios contenedores efímeros en CI; este servicio es para uso manual
  # en desarrollo). Volumen no persistente: cada arranque queda limpio.
  db-test:
    image: postgres:18.6-alpine
    container_name: valuacion-db-test
    restart: unless-stopped
    environment:
      POSTGRES_DB: valuacion_test
      POSTGRES_USER: ${POSTGRES_TEST_USER:-valuacion_test}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-valuacion_test}
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_TEST_USER:-valuacion_test} -d valuacion_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  valuacion_dev_data:
