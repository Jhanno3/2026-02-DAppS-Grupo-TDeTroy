name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    # Mismo servicio Postgres que ci.yml: los @SpringBootTest (ValuacionJugadoresApplicationTests,
    # AuthControllerTest, JugadorControllerTest) necesitan una base real corriendo, y los
    # *RepositoryTest levantan su propio contenedor via Testcontainers, que requiere Docker Linux
    # (windows-latest no lo soporta, de ahi "Could not initialize class ...PostgresIntegrationTest").
    services:
      db:
        image: postgres:18.6-alpine
        # credentials: ver mismo comentario en ci.yml -- autentica el pull contra Docker Hub
        # con cuenta (200 pulls/6h) en vez de anónimo por IP compartida del runner.
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_DB: valuacion_dev
          POSTGRES_USER: valuacion
          POSTGRES_PASSWORD: valuacion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valuacion -d valuacion_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      # Deja la sesión en el daemon Docker del runner para que los *RepositoryTest
      # (Testcontainers, su propio pull de postgres) también la usen durante `mvn verify`.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: 'zulu' # Alternative distribution options are available.
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests with coverage
        working-directory: frontend
        # Genera frontend/coverage/lcov.info *antes* del scan de Sonar (abajo) -- sin este paso,
        # Sonar nunca ve cobertura de frontend/src (quedaba en 0%, arrastrando "new code coverage"
        # muy por debajo del 80% aunque los tests existieran).
        run: npm run test:coverage
      - name: Corregir las rutas del lcov de frontend para que matcheen sonar.sources
        # Vitest escribe las rutas "SF:" relativas a frontend/ (su propio cwd/root, ej.
        # "SF:src/api/client.ts"), pero el scan de Sonar corre desde la raiz del repo con
        # sonar.sources=frontend/src -- sin este prefijo, Sonar nunca matchea el reporte contra
        # los archivos que analiza y descarta la cobertura entera en silencio.
        run: sed -i 's|^SF:|SF:frontend/|' frontend/coverage/lcov.info
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # dependency-check.skip=true: mismo motivo que ci.yml (OWASP Dependency-Check necesita
        # NVD_API_KEY, no configurada todavia).
        # Un solo analisis cubriendo back y front bajo el mismo projectKey: Sonar trata cada
        # analisis como una foto completa del proyecto, asi que un segundo job/scan separado con
        # el mismo key pisaria por completo los resultados de este (no se combinan).
        #
        # sonar.sources=frontend/src incluye los *.test.ts(x) co-ubicados junto a cada componente
        # (no hay carpeta de tests separada en frontend, a diferencia del backend) -- sin
        # sonar.test.inclusions, Sonar los contaba como código fuente nuevo sin cobertura en vez
        # de como tests, inflando el denominador de "new code coverage" con los tests mismos.
        # sonar.javascript.lcov.reportPaths apunta al reporte generado en el paso anterior
        # (sonar-javascript cubre TS también, no hace falta la propiedad "typescript" separada).
        run: >-
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Ddependency-check.skip=true
          -Dsonar.projectKey=Jhanno3_2026-02-DAppS-Grupo-TDeTroy
          -Dsonar.sources=src/main/java,frontend/src
          -Dsonar.tests=src/test/java,frontend/e2e
          -Dsonar.test.inclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx
          -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
          -Dsonar.exclusions=frontend/node_modules/**,frontend/dist/**,frontend/coverage/**,frontend/test-results/**,frontend/playwright-report/**
