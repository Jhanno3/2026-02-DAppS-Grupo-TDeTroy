name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    # Mismo servicio Postgres que ci.yml: los @SpringBootTest (ValuacionJugadoresApplicationTests,
    # AuthControllerTest, JugadorControllerTest) necesitan una base real corriendo, y los
    # *RepositoryTest levantan su propio contenedor via Testcontainers, que requiere Docker Linux
    # (windows-latest no lo soporta, de ahi "Could not initialize class ...PostgresIntegrationTest").
    services:
      db:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: valuacion_dev
          POSTGRES_USER: valuacion
          POSTGRES_PASSWORD: valuacion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U valuacion -d valuacion_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: 21
          distribution: 'zulu' # Alternative distribution options are available.
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        # dependency-check.skip=true: mismo motivo que ci.yml (OWASP Dependency-Check necesita
        # NVD_API_KEY, no configurada todavia).
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Ddependency-check.skip=true -Dsonar.projectKey=Jhanno3_2026-02-DAppS-Grupo-TDeTroy
